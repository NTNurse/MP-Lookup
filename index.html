<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Your NT MLA</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <main class="max-w-xl mx-auto px-4 py-12 w-full">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-tight text-slate-900 mb-2">Contact Your NT MLA</h1>
            <p class="text-slate-600">Enter your postcode, choose your suburb, and contact your representative.</p>
        </div>

        <!-- Input Card -->
        <div class="bg-white shadow-sm ring-1 ring-slate-900/5 rounded-2xl p-6 sm:p-8 mb-6 space-y-4">
            <div>
                <label for="postcode-input" class="block text-sm font-medium leading-6 text-slate-900 mb-1">Your Postcode</label>
                <input type="text" id="postcode-input" maxlength="4" placeholder="e.g. 0800, 0810, 0820" oninput="handlePostcodeChange()"
                    class="block w-full rounded-lg border-0 py-3 px-4 text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 placeholder:text-slate-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 text-lg">
            </div>

            <!-- Suburb Dropdown (Appears when postcode matches) -->
            <div id="suburb-wrapper" class="hidden">
                <label for="suburb-select" class="block text-sm font-medium leading-6 text-slate-900 mb-1">Select Your Suburb</label>
                <select id="suburb-select" onchange="onSuburbSelected()"
                    class="block w-full rounded-lg border-0 py-3 px-4 text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 text-base bg-white">
                    <option value="">-- Choose your suburb --</option>
                </select>
            </div>

            <div>
                <label for="user-name" class="block text-sm font-medium leading-6 text-slate-900 mb-1">Your Name</label>
                <input type="text" id="user-name" placeholder="First and Last Name" oninput="updateMessagePreview()"
                    class="block w-full rounded-lg border-0 py-3 px-4 text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 placeholder:text-slate-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 text-base">
            </div>
        </div>

        <!-- Result & Email Draft Area -->
        <div id="result-container" class="hidden bg-white shadow-sm ring-1 ring-slate-900/5 rounded-2xl p-6 sm:p-8 space-y-6 transition-all">
            <!-- MLA Info Box -->
            <div class="border-b border-slate-100 pb-4">
                <h2 class="text-xs font-semibold uppercase tracking-wider text-indigo-600 mb-1">Your Representative</h2>
                <div id="mla-name" class="text-xl font-bold text-slate-900"></div>
                <div id="mla-division" class="text-sm font-medium text-slate-500"></div>
            </div>

            <!-- Email Draft Box -->
            <div class="space-y-3">
                <div class="flex items-center justify-between text-sm">
                    <span class="font-medium text-slate-700">To:</span>
                    <span id="display-email" class="text-indigo-600 font-medium"></span>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Message Preview:</label>
                    <textarea id="email-body" rows="8" oninput="manualEdit()" class="block w-full rounded-lg border-0 p-3 text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 text-sm focus:ring-2 focus:ring-indigo-600 leading-relaxed"></textarea>
                </div>

                <!-- Copy Actions -->
                <div class="pt-2 flex flex-col sm:flex-row gap-3">
                    <button onclick="copyEmailContent()" class="flex-1 rounded-lg bg-slate-900 px-4 py-3 text-center text-sm font-semibold text-white shadow-sm hover:bg-slate-800 transition-colors">
                        📋 Copy Email Details
                    </button>
                    <a id="mailto-link" href="#" class="flex-1 rounded-lg bg-emerald-600 px-4 py-3 text-center text-sm font-semibold text-white shadow-sm hover:bg-emerald-500 transition-colors">
                        ✉️ Open in Mail App
                    </a>
                </div>
                <p id="copy-feedback" class="text-center text-xs text-emerald-600 font-medium hidden">Copied to clipboard successfully!</p>
            </div>
        </div>

        <!-- Error Area -->
        <div id="error-container" class="hidden bg-red-50 ring-1 ring-red-200 rounded-2xl p-6 text-center text-red-700 text-sm">
            Please enter a valid 4-digit NT postcode (e.g. 0800, 0810, 0820).
        </div>
    </main>

    <footer class="text-center py-6 text-xs text-slate-400">
        Hosted with GitHub Pages
    </footer>

    <script>
        // Database mapping postcodes to their possible suburbs and corresponding MLA
        const postcodeDatabase = {
            "0800": {
                suburbs: ["Darwin City", "Larrakeyah", "Stuart Park", "The Gardens", "Cullen Bay"],
                mla: { name: "MLA for Port Darwin", division: "Port Darwin", email: "electorate.portdarwin@nt.gov.au" }
            },
            "0810": {
                suburbs: ["Fannie Bay", "Parap", "Minnie Park"],
                mla: { name: "MLA for Fannie Bay", division: "Fannie Bay", email: "electorate.fanniebay@nt.gov.au" }
            },
            "0812": {
                suburbs: ["Nightcliff", "Millner", "Rapid Creek"],
                mla: { name: "MLA for Nightcliff", division: "Nightcliff", email: "electorate.nightcliff@nt.gov.au" }
            },
            "0820": {
                suburbs: ["Casuarina", "Wagaman", "Nakara", "Brinkin", "Tiwi", "Muirhead"],
                mla: { name: "MLA for Casuarina", division: "Casuarina", email: "electorate.casuarina@nt.gov.au" }
            },
            "0830": {
                suburbs: ["Palmerston (Selected Suburbs)", "Brennan", "Gray", "Driver"],
                mla: { name: "MLA for Brennan", division: "Brennan", email: "electorate.brennan@nt.gov.au" }
            },
            "0870": {
                suburbs: ["Alice Springs (Town)", "Braitling", "The Gap", "Anzac Hill"],
                mla: { name: "MLA for Braitling", division: "Braitling", email: "electorate.braitling@nt.gov.au" }
            }
        };

        let currentActiveEmail = "";

        function getTemplateText(userName) {
            const nameToUse = userName.trim() ? userName.trim() : "[Your Name]";
            return `Dear Member,

I am writing to you today as my local representative to raise an important matter regarding our community and local services. 

[Insert your specific issue or question here]

Thank you for your time and attention to this matter. I look forward to your response.

Sincerely,
${nameToUse}`;
        }

        function handlePostcodeChange() {
            const postcode = document.getElementById('postcode-input').value.trim();
            const suburbWrapper = document.getElementById('suburb-wrapper');
            const suburbSelect = document.getElementById('suburb-select');
            const resultContainer = document.getElementById('result-container');
            const errorContainer = document.getElementById('error-container');

            // Reset UI states
            suburbWrapper.classList.add('hidden');
            resultContainer.classList.add('hidden');
            errorContainer.classList.add('hidden');
            suburbSelect.innerHTML = '<option value="">-- Choose your suburb --</option>';

            if (postcode.length === 4) {
                if (postcodeDatabase[postcode]) {
                    const data = postcodeDatabase[postcode];
                    data.suburbs.forEach(suburb => {
                        const opt = document.createElement('option');
                        opt.value = suburb;
                        opt.textContent = suburb;
                        suburbSelect.appendChild(opt);
                    });
                    suburbWrapper.classList.remove('hidden');
                } else {
                    errorContainer.innerText = `No suburbs found for postcode ${postcode}. Try 0800, 0810, 0812, or 0820.`;
                    errorContainer.classList.remove('hidden');
                }
            }
        }

        function onSuburbSelected() {
            const postcode = document.getElementById('postcode-input').value.trim();
            const selectedSuburb = document.getElementById('suburb-select').value;
            const userName = document.getElementById('user-name').value;
            const resultContainer = document.getElementById('result-container');

            resultContainer.classList.add('hidden');

            if (!selectedSuburb) return;

            const data = postcodeDatabase[postcode];
            if (data && data.mla) {
                const match = data.mla;
                currentActiveEmail = match.email;
                document.getElementById('mla-name').innerText = match.name;
                document.getElementById('mla-division').innerText = `Division of ${match.division} (${selectedSuburb})`;
                document.getElementById('display-email').innerText = match.email;
                
                // Set text area template
                document.getElementById('email-body').value = getTemplateText(userName);

                // Set mailto link
                const subject = encodeURIComponent("Constituent Inquiry from " + selectedSuburb);
                const body = encodeURIComponent(document.getElementById('email-body').value);
                document.getElementById('mailto-link').href = `mailto:${match.email}?subject=${subject}&body=${body}`;

                resultContainer.classList.remove('hidden');
            }
        }

        function updateMessagePreview() {
            const userName = document.getElementById('user-name').value;
            const emailBox = document.getElementById('email-body');
            if (!document.getElementById('result-container').classList.contains('hidden')) {
                emailBox.value = getTemplateText(userName);
                updateMailtoLink();
            }
        }

        function manualEdit() {
            updateMailtoLink();
        }

        function updateMailtoLink() {
            const body = encodeURIComponent(document.getElementById('email-body').value);
            const subject = encodeURIComponent("Constituent Inquiry");
            if (currentActiveEmail) {
                document.getElementById('mailto-link').href = `mailto:${currentActiveEmail}?subject=${subject}&body=${body}`;
            }
        }

        function copyEmailContent() {
            const email = currentActiveEmail;
            const body = document.getElementById('email-body').value;
            const fullText = `To: ${email}\n\n${body}`;

            navigator.clipboard.writeText(fullText).then(() => {
                const feedback = document.getElementById('copy-feedback');
                feedback.classList.remove('hidden');
                setTimeout(() => feedback.classList.add('hidden'), 3000);
            });
        }
    </script>
</body>
</html>
