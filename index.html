<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Your NT MLA</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <main class="max-w-xl mx-auto px-4 py-12 w-full">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-tight text-slate-900 mb-2">Contact Your NT MLA</h1>
            <p class="text-slate-600">Type your suburb to find your representative, generate your message, and copy or send.</p>
        </div>

        <!-- Input Card -->
        <div class="bg-white shadow-sm ring-1 ring-slate-900/5 rounded-2xl p-6 sm:p-8 mb-6 space-y-4 relative">
            <div>
                <label for="suburb-input" class="block text-sm font-medium leading-6 text-slate-900 mb-1">Your Suburb</label>
                <input type="text" id="suburb-input" placeholder="Start typing suburb (e.g. Darwin City, Nightcliff...)" oninput="filterSuburbs()" autocomplete="off"
                    class="block w-full rounded-lg border-0 py-3 px-4 text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 placeholder:text-slate-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 text-lg">
                
                <!-- Dynamic Suburb Suggestions Dropdown -->
                <div id="suggestions-box" class="hidden mt-1 bg-white shadow-lg rounded-lg ring-1 ring-slate-900/5 max-h-48 overflow-y-auto absolute z-10 w-full left-0 right-0 px-6"></div>
            </div>

            <div>
                <label for="user-name" class="block text-sm font-medium leading-6 text-slate-900 mb-1">Your Name</label>
                <input type="text" id="user-name" placeholder="First and Last Name" oninput="updateMessagePreview()"
                    class="block w-full rounded-lg border-0 py-3 px-4 text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 placeholder:text-slate-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 text-base">
            </div>
        </div>

        <!-- Result & Email Draft Area -->
        <div id="result-container" class="hidden bg-white shadow-sm ring-1 ring-slate-900/5 rounded-2xl p-6 sm:p-8 space-y-6 transition-all">
            <!-- MLA Info Box -->
            <div class="border-b border-slate-100 pb-4">
                <h2 class="text-xs font-semibold uppercase tracking-wider text-indigo-600 mb-1">Your Representative</h2>
                <div id="mla-name" class="text-xl font-bold text-slate-900"></div>
                <div id="mla-division" class="text-sm font-medium text-slate-500"></div>
            </div>

            <!-- Email Draft Box -->
            <div class="space-y-3">
                <div class="flex items-center justify-between text-sm">
                    <span class="font-medium text-slate-700">To:</span>
                    <span id="display-email" class="text-indigo-600 font-medium"></span>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Message Preview:</label>
                    <textarea id="email-body" rows="9" oninput="manualEdit()" class="block w-full rounded-lg border-0 p-3 text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 text-sm focus:ring-2 focus:ring-indigo-600 leading-relaxed"></textarea>
                </div>

                <!-- Copy Actions -->
                <div class="pt-2 flex flex-col sm:flex-row gap-3">
                    <button onclick="copyEmailContent()" class="flex-1 rounded-lg bg-slate-900 px-4 py-3 text-center text-sm font-semibold text-white shadow-sm hover:bg-slate-800 transition-colors">
                        📋 Copy Email Details
                    </button>
                    <a id="mailto-link" href="#" class="flex-1 rounded-lg bg-emerald-600 px-4 py-3 text-center text-sm font-semibold text-white shadow-sm hover:bg-emerald-500 transition-colors">
                        ✉️ Open in Mail App
                    </a>
                </div>
                <p id="copy-feedback" class="text-center text-xs text-emerald-600 font-medium hidden">Copied to clipboard successfully!</p>
            </div>
        </div>

        <!-- Error Area -->
        <div id="error-container" class="hidden bg-red-50 ring-1 ring-red-200 rounded-2xl p-6 text-center text-red-700 text-sm">
            Please select a valid suburb from the suggestion list.
        </div>
    </main>

    <footer class="text-center py-6 text-xs text-slate-400">
        Hosted with GitHub Pages
    </footer>

    <script>
        // Accurate database matching NT suburbs to their current MLAs and divisions
        const ntSuburbs = [
            { suburb: "Darwin City", mla: "Hon Robyn Cahill OAM", division: "Port Darwin", email: "electorate.portdarwin@nt.gov.au" },
            { suburb: "Larrakeyah", mla: "Hon Robyn Cahill OAM", division: "Port Darwin", email: "electorate.portdarwin@nt.gov.au" },
            { suburb: "Stuart Park", mla: "Hon Robyn Cahill OAM", division: "Port Darwin", email: "electorate.portdarwin@nt.gov.au" },
            { suburb: "The Gardens", mla: "Hon Robyn Cahill OAM", division: "Port Darwin", email: "electorate.portdarwin@nt.gov.au" },
            { suburb: "Cullen Bay", mla: "Hon Robyn Cahill OAM", division: "Port Darwin", email: "electorate.portdarwin@nt.gov.au" },
            
            { suburb: "Fannie Bay", mla: "Laurie Zio", division: "Fannie Bay", email: "electorate.fanniebay@nt.gov.au" },
            { suburb: "Parap", mla: "Laurie Zio", division: "Fannie Bay", email: "electorate.fanniebay@nt.gov.au" },
            { suburb: "Minnie Park", mla: "Laurie Zio", division: "Fannie Bay", email: "electorate.fanniebay@nt.gov.au" },
            
            { suburb: "Nightcliff", mla: "Ed Smelt", division: "Nightcliff", email: "electorate.nightcliff@nt.gov.au" },
            { suburb: "Millner", mla: "Ed Smelt", division: "Nightcliff", email: "electorate.nightcliff@nt.gov.au" },
            { suburb: "Rapid Creek", mla: "Ed Smelt", division: "Nightcliff", email: "electorate.nightcliff@nt.gov.au" },
            
            { suburb: "Casuarina", mla: "Khoda Patel", division: "Casuarina", email: "electorate.casuarina@nt.gov.au" },
            { suburb: "Wagaman", mla: "Khoda Patel", division: "Casuarina", email: "electorate.casuarina@nt.gov.au" },
            { suburb: "Nakara", mla: "Khoda Patel", division: "Casuarina", email: "electorate.casuarina@nt.gov.au" },
            { suburb: "Brinkin", mla: "Khoda Patel", division: "Casuarina", email: "electorate.casuarina@nt.gov.au" },
            { suburb: "Tiwi", mla: "Khoda Patel", division: "Casuarina", email: "electorate.casuarina@nt.gov.au" },
            { suburb: "Muirhead", mla: "Khoda Patel", division: "Casuarina", email: "electorate.casuarina@nt.gov.au" },
            
            { suburb: "Palmerston", mla: "Clinton Howe", division: "Drysdale / Brennan", email: "electorate.drysdale@nt.gov.au" },
            { suburb: "Gray", mla: "Marie-Clare Boothby", division: "Brennan", email: "electorate.brennan@nt.gov.au" },
            { suburb: "Driver", mla: "Marie-Clare Boothby", division: "Brennan", email: "electorate.brennan@nt.gov.au" },
            
            { suburb: "Alice Springs", mla: "Joshua Burgoyne", division: "Braitling", email: "electorate.braitling@nt.gov.au" }
        ];

        let currentActiveMatch = null;

        function getTemplateText(mlaName, userName) {
            const mlaToUse = mlaName ? mlaName : "[MLA Name]";
            const nameToUse = userName.trim() ? userName.trim() : "[Your Name]";
            
            return `Dear ${mlaToUse},

I am writing to you today as my local representative for the Northern Territory Legislative Assembly to raise an important matter regarding our community and local services. 

[Insert your specific issue or question here]

Thank you for your time and attention to this matter. I look forward to your response.

Sincerely,
${nameToUse}`;
        }

        function filterSuburbs() {
            const input = document.getElementById('suburb-input').value.toLowerCase().trim();
            const suggestionsBox = document.getElementById('suggestions-box');
            
            suggestionsBox.innerHTML = '';
            if (!input) {
                suggestionsBox.classList.add('hidden');
                return;
            }

            const matches = ntSuburbs.filter(item => item.suburb.toLowerCase().includes(input));

            if (matches.length > 0) {
                matches.forEach(match => {
                    const div = document.createElement('div');
                    div.className = 'py-2 px-3 hover:bg-slate-100 cursor-pointer text-sm text-slate-700 rounded';
                    div.innerHTML = `<strong>${match.suburb}</strong> <span class="text-xs text-slate-400">(${match.mla} - ${match.division})</span>`;
                    div.onclick = () => selectSuburb(match);
                    suggestionsBox.appendChild(div);
                });
                suggestionsBox.classList.remove('hidden');
            } else {
                suggestionsBox.classList.add('hidden');
            }
        }

        function selectSuburb(match) {
            currentActiveMatch = match;
            document.getElementById('suburb-input').value = match.suburb;
            document.getElementById('suggestions-box').classList.add('hidden');
            document.getElementById('error-container').classList.add('hidden');

            document.getElementById('mla-name').innerText = match.mla;
            document.getElementById('mla-division').innerText = `Division of ${match.division} (${match.suburb})`;
            document.getElementById('display-email').innerText = match.email;

            const userName = document.getElementById('user-name').value;
            document.getElementById('email-body').value = getTemplateText(match.mla, userName);

            updateMailtoLink();
            document.getElementById('result-container').classList.remove('hidden');
        }

        function updateMessagePreview() {
            const userName = document.getElementById('user-name').value;
            const emailBox = document.getElementById('email-body');
            if (currentActiveMatch && !document.getElementById('result-container').classList.contains('hidden')) {
                emailBox.value = getTemplateText(currentActiveMatch.mla, userName);
                updateMailtoLink();
            }
        }

        function manualEdit() {
            updateMailtoLink();
        }

        function updateMailtoLink() {
            const body = encodeURIComponent(document.getElementById('email-body').value);
            const subject = encodeURIComponent("Constituent Inquiry");
            if (currentActiveMatch) {
                document.getElementById('mailto-link').href = `mailto:${currentActiveMatch.email}?subject=${subject}&body=${body}`;
            }
        }

        function copyEmailContent() {
            if (!currentActiveMatch) return;
            const email = currentActiveMatch.email;
            const body = document.getElementById('email-body').value;
            const fullText = `To: ${email}\n\n${body}`;

            navigator.clipboard.writeText(fullText).then(() => {
                const feedback = document.getElementById('copy-feedback');
                feedback.classList.remove('hidden');
                setTimeout(() => feedback.classList.add('hidden'), 3000);
            });
        }
    </script>
</body>
</html>
